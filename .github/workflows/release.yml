name: Release Editor

# ---------------------------------------------------------------------------
# WalnutAI Editor release pipeline — Windows x64 (first target).
#
# Same shape as the Walnut Agent pipeline: this workflow must live in the
# GitHub repo (walnutai-labs), the SOURCE OF TRUTH stays in self-hosted
# GitLab, and each runner clones it at build time. Nothing but releases and
# this file live on GitHub.
#
# Two clones per build — the editor repo alone is NOT buildable:
#   1. walnut-code-editor at the given tag (the fork; src/)
#   2. walnut-vscode at engine_ref (the engine; engine/) — because
#      extensions/walnutai.walnut/ is GITIGNORED build output in the editor
#      repo and must be produced from the engine's dist/extension.
#      REMEMBER: push the engine's cloud-agent branch before dispatching, or
#      the build ships whatever the remote last saw.
#
# Triggers (the tag must already exist in GITLAB — that is where source is
# cloned from; the GitHub tag is only a marker on this release-shell repo):
#   1. Actions -> Release Editor -> Run workflow -> tag (e.g. editor-v0.1.0)
#   2. Pushing a tag named editor-v* to THIS repo (engine_ref defaults to
#      cloud-agent). Lets contents-write tokens start a build without
#      Actions permissions.
# Tags with a "-suffix" become pre-releases.
#
# Outputs uploaded to the GitHub Release:
#   WalnutAI-Setup-x64-<tag>.exe   (Inno Setup per-user installer)
#   WalnutAI-win32-x64-<tag>.zip   (portable build; unzip and run WalnutAI.exe)
#
# GOTCHA (cost one run): the editor's build/npm/preinstall.ts only looks for
# Visual Studio 2019/2022 at hardcoded Program Files paths and fails on
# runners with a newer VS layout. The "Locate Visual Studio" step finds the
# real install with vswhere and exports vs2022_install — the escape hatch
# preinstall.ts itself documents.
#
# Code signing: same scheme as walnut-agent — WIN_CSC_LINK (base64 PFX) +
# WIN_CSC_KEY_PASSWORD repo secrets. When present, every packaged .exe and
# the Inno installer are Authenticode-signed (SHA256 + RFC3161 timestamp).
# When absent, the signing steps are skipped and the build ships unsigned
# (SmartScreen: "More info" -> "Run anyway"). The embedded Inno UNINSTALLER
# is not signed yet — that needs a SignTool= entry in the .iss (later).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Editor git tag to build (must already exist in GitLab), e.g. editor-v0.1.0"
        required: true
      engine_ref:
        description: "walnut-vscode ref for the bundled engine"
        required: true
        default: "cloud-agent"
  push:
    tags:
      - "editor-v*"

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ENGINE_REF: ${{ github.event.inputs.engine_ref || 'cloud-agent' }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*.*|*-alpha*|*-beta*|*-rc*|*-qa*|*-dev*) PRERELEASE="--prerelease" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target main --title "$TAG" \
              --notes "Automated build for $TAG (engine: $ENGINE_REF)" $PRERELEASE
          fi

  windows-x64:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Clone editor from GitLab at tag
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "$TAG" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-code-editor.git" src

      - name: Clone engine from GitLab
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "$ENGINE_REF" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-vscode.git" engine

      - name: Set up Node.js (editor's pinned version)
        uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc

      # ---- Engine: build the bundled extension --------------------------------
      # --legacy-peer-deps: the repo carries a known solid-js/opentui peer
      # conflict; the team installs with this flag. `npm run build` (build-all)
      # bundles the extension + webview + the built-in Common QA MCP; the
      # Bun-only CLI build is skipped automatically outside Bun.
      - name: Build engine extension
        shell: bash
        working-directory: engine
        run: |
          npm install --legacy-peer-deps
          npm run build
          test -f dist/extension/extension.js
          test -f dist/extension/resources/common-qa-mcp/cli.bundle.js

      - name: Bundle engine into editor (gitignored path, rsynced in dev)
        shell: bash
        run: |
          mkdir -p src/extensions/walnutai.walnut
          cp -R engine/dist/extension/. src/extensions/walnutai.walnut/
          rm -f src/extensions/walnutai.walnut/*.vsix

      # ---- Editor: compile + package ------------------------------------------
      # preinstall.ts only probes Program Files for VS 2019/2022; find the
      # actual toolchain and hand it over via the documented env override.
      - name: Locate Visual Studio C++ toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found on this runner" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            Write-Host "vswhere found no install with VC tools; all installs:"
            & $vswhere -all -products * -property installationPath
            throw "No Visual Studio with the C++ toolchain on this runner"
          }
          Write-Host "Using Visual Studio at: $vs"
          "vs2022_install=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # patchWin32Dependencies (inside vscode-win32-x64-min) probes every PE
      # with `signtool.exe verify` before rcedit; signtool ships in the
      # Windows SDK but is NOT on PATH -> spawn ENOENT killed a run.
      - name: Add signtool to PATH
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like '*\x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found under $kits" }
          Write-Host "Using $($signtool.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.DirectoryName

      - name: Install editor dependencies
        shell: bash
        working-directory: src
        run: npm ci

      - name: Build Windows x64 package
        shell: bash
        working-directory: src
        run: npm run gulp vscode-win32-x64-min

      # ---- Signing (skipped when the cert secrets are not configured) ----------
      # Sign BEFORE the installer is built so the installed files are signed,
      # and AFTER vscode-win32-x64-min so rcedit's PE edits don't invalidate
      # the signatures. Same cert as walnut-agent (base64 PFX in WIN_CSC_LINK).
      - name: Sign application binaries
        if: ${{ secrets.WIN_CSC_LINK != '' }}
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $targets = Get-ChildItem -Path "VSCode-win32-x64" -Recurse -Include *.exe
          Write-Host "Signing $($targets.Count) executables"
          foreach ($f in $targets) {
            & signtool sign /f $pfx /p $env:WIN_CSC_KEY_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($f.FullName)" }
          }
          Remove-Item $pfx

      - name: Build per-user installer (Inno Setup)
        shell: bash
        working-directory: src
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Sign installer
        if: ${{ secrets.WIN_CSC_LINK != '' }}
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $setup = Get-ChildItem "src/.build/win32-x64/user-setup/*.exe" | Select-Object -First 1
          & signtool sign /f $pfx /p $env:WIN_CSC_KEY_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "signing failed: $($setup.FullName)" }
          & signtool verify /pa $setup.FullName
          Remove-Item $pfx

      - name: Collect artifacts
        shell: bash
        run: |
          # vscode-win32-x64-min emits the app next to the repo checkout.
          7z a "WalnutAI-win32-x64-$TAG.zip" ./VSCode-win32-x64/*
          SETUP=$(ls src/.build/win32-x64/user-setup/*.exe | head -1)
          cp "$SETUP" "WalnutAI-Setup-x64-$TAG.exe"
          ls -la WalnutAI-*

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" "WalnutAI-Setup-x64-$TAG.exe" "WalnutAI-win32-x64-$TAG.zip" --clobber
